<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#ffffff;overflow-x:hidden}
.wrapper{max-width:900px;margin:0 auto;padding:24px;width:100%;box-sizing:border-box}
.flow{display:flex;flex-direction:column;gap:18px}

/* ===== MENSAGENS ===== */
.bot-box{
  background:#1e5cc6;
  color:#fff;
  border-radius:14px;
  padding:16px 18px;
  line-height:1.5;
  font-size:15px;
  max-width:78%;
  align-self:flex-start;
}

.user-action{
  background:#e5e7eb;
  color:#111;
  border-radius:14px;
  padding:10px 16px;
  font-size:14px;
  max-width:70%;
  align-self:flex-end;
}

/* ===== BOTÃO LATERAL ===== */
.side-action{align-self:flex-end}
.side-action button{
  background:#e5e7eb;
  border:none;
  border-radius:20px;
  padding:10px 18px;
  font-size:14px;
  cursor:pointer;
}

/* ===== BOTÃO PRINCIPAL ===== */
.primary-btn{
  width:100%;
  background:#28a745;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:16px;
  font-size:15px;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

/* ===== BOTÃO CARD ===== */
.card-btn{
  width:80%;
  background:#1e5cc6;
  color:#fff;
  border:none;
  border-radius:14px;
  padding:16px 18px;
  font-size:15px;
  cursor:pointer;
  margin-top:18px;
  line-height:1.5;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  transition: background-color 0.2s ease;
}

.card-btn:hover{
  background:#1658b8;
}

/* ===== MESES ===== */
.months{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:100%;
  overflow:hidden;
}
.month{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:16px;
  text-align:center;
  cursor:pointer;
  min-width:0; /* Permite que o texto quebre se necessário */
  word-wrap:break-word;
}
.month strong{
  font-size:14px;
  display:block;
  margin-bottom:4px;
}
.month span{
  display:block;
  color:#1e5cc6;
  font-size:12px;
  margin-top:4px;
}

/* ===== RESPONSIVIDADE PARA MOBILE ===== */
@media (max-width: 768px) {
  .wrapper{
    padding:16px;
    max-width:100%;
  }

  .months{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .month{
    padding:12px;
    font-size:13px;
  }

  .month strong{
    font-size:13px;
  }

  .month span{
    font-size:11px;
  }
}

@media (max-width: 480px) {
  .wrapper{
    padding:12px;
  }

  .months{
    grid-template-columns:1fr;
    gap:10px;
  }

  .month{
    padding:14px;
    text-align:left;
  }

  .bot-box, .user-action{
    max-width:95%;
    font-size:14px;
  }

  .confirm-box{
    max-width:95%;
    font-size:13px;
    padding:10px 14px;
  }

  /* Comprovantes e guias responsivas */
  .bg-white.border{
    max-width:100%;
    overflow-x:auto;
  }

  /* Botões responsivos */
  .card-btn, .primary-btn{
    width:100%;
    margin:8px 0;
  }
}

/* ===== CONFIRMANDO CADASTRO ===== */
.confirm-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px 16px;
  font-size:14px;
  color:#111;
  max-width:fit-content;
  align-self:flex-start;
  width:100%;
  box-sizing:border-box;
}
.confirm-spin{
  width:16px;
  height:16px;
  border:2px solid #cbd5e1;
  border-top:2px solid #1e5cc6;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

<script>
const flow = document.getElementById('flow');

// ===== AUTO-SCROLL =====
function scrollToBottom(smooth = true, force = false) {
  // Pequeno delay para garantir que o DOM foi atualizado
  setTimeout(() => {
    try {
      // Método principal: scrollIntoView no último elemento do flow
      const lastElement = document.querySelector('.flow > *:last-child');
      if (lastElement) {
        lastElement.scrollIntoView({
          behavior: smooth ? 'smooth' : 'auto',
          block: 'end',
          inline: 'nearest'
        });
        return; // Sucesso, não precisa tentar outros métodos
      }

      // Método alternativo: window.scrollTo
      if (document.body.scrollHeight > window.innerHeight) {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: smooth ? 'smooth' : 'auto'
        });
      }

      // Método final: wrapper.scrollTo
      const wrapper = document.querySelector('.wrapper');
      if (wrapper && wrapper.scrollHeight > wrapper.clientHeight) {
        wrapper.scrollTo({
          top: wrapper.scrollHeight,
          behavior: smooth ? 'smooth' : 'auto'
        });
      }

    } catch (error) {
      console.warn('Erro no scroll automático:', error);
      // Fallback forçado se der erro
      if (force) {
        window.scrollTo(0, document.body.scrollHeight);
      }
    }
  }, force ? 50 : 200); // Delay menor para scroll forçado
}

// Função de debug (remover depois)
function debugScroll() {
  console.log('Scroll Debug:', {
    bodyScrollHeight: document.body.scrollHeight,
    windowHeight: window.innerHeight,
    lastElement: document.querySelector('.flow > *:last-child')?.className,
    wrapperScrollHeight: document.querySelector('.wrapper')?.scrollHeight
  });
}

// Função para observar mudanças no DOM e rolar automaticamente
function setupAutoScroll() {
  const observer = new MutationObserver((mutations) => {
    let shouldScroll = false;

    mutations.forEach((mutation) => {
      if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
        // Verificar se foi adicionada uma mensagem, botão ou elemento importante
        const hasNewContent = Array.from(mutation.addedNodes).some(node => {
          if (node.nodeType !== Node.ELEMENT_NODE) return false;

          // Elementos que devem trigger scroll
          return node.classList?.contains('bot-box') ||
                 node.classList?.contains('user-action') ||
                 node.classList?.contains('confirm-box') ||
                 node.classList?.contains('side-action') ||
                 node.classList?.contains('card-btn') ||
                 node.classList?.contains('primary-btn') ||
                 node.classList?.contains('months') ||
                 node.tagName === 'BUTTON' ||
                 node.querySelector?.('button') ||
                 node.querySelector?.('.bot-box') ||
                 node.querySelector?.('.user-action') ||
                 node.querySelector?.('.confirm-box');
        });

        if (hasNewContent) {
          shouldScroll = true;
        }
      }
    });

    // Só rolar se realmente há novo conteúdo relevante
    if (shouldScroll) {
      scrollToBottom(true);
    }
  });

  // Observar mudanças no flow com configurações mais sensíveis
  observer.observe(flow, {
    childList: true,
    subtree: true,
    attributes: false,
    characterData: false
  });

  return observer;
}

function bot(html){
  const d=document.createElement('div');
  d.className='bot-box';
  d.innerHTML=html;
  flow.appendChild(d);
  scrollToBottom();
}

function clearSide(){
  document.querySelectorAll('.side-action').forEach(e=>e.remove());
}

function side(label,cb){
  const d=document.createElement('div');
  d.className='side-action';
  const b=document.createElement('button');
  b.textContent=label;
  b.onclick=()=>{
    const u=document.createElement('div');
    u.className='user-action';
    u.textContent=label;
    flow.appendChild(u);
    scrollToBottom();
    clearSide();

    const confirm=document.createElement('div');
    confirm.className='confirm-box';
    confirm.innerHTML='<div class="confirm-spin"></div> Processando...';
    flow.appendChild(confirm);
    scrollToBottom();

    setTimeout(()=>{
      confirm.remove();
      cb();
    },900);
  };
  d.appendChild(b);
  flow.appendChild(d);
  scrollToBottom();
}

function getCurrentDateTime() {
  const now = new Date();
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = now.getFullYear();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');

  return {
    date: `${day}/${month}/${year}`,
    time: `${hours}:${minutes}`,
    full: `Emitido em ${day}/${month}/${year} às ${hours}:${minutes}`,
    fullUpper: `EMITIDO EM ${day}/${month}/${year} ÀS ${hours}:${minutes}`
  };
}

// ===== CRONÔMETRO =====
function startCountdownTimer() {
  let totalSeconds = 596; // 9 minutos e 56 segundos (09:56)

  const timerElement = document.getElementById('timer');
  if (!timerElement) return;

  const updateTimer = () => {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    // Formatar como MM:SS
    const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

    timerElement.textContent = formattedTime;

    // Mudar cor quando estiver acabando (últimos 60 segundos)
    if (totalSeconds <= 60) {
      timerElement.className = 'font-bold text-red-600 animate-pulse';
    } else if (totalSeconds <= 120) {
      timerElement.className = 'font-bold text-orange-600';
    }

    totalSeconds--;

    if (totalSeconds < 0) {
      // Quando o tempo acabar
      timerElement.textContent = '00:00';
      timerElement.className = 'font-bold text-red-600 animate-pulse';
      clearInterval(timerInterval);
    }
  };

  // Atualizar imediatamente e depois a cada segundo
  updateTimer();
  const timerInterval = setInterval(updateTimer, 1000);
}

// ===== GERAR CÓDIGO PIX =====
async function generatePixCode() {
  try {
    // Dados (você pode modificar conforme necessário)
    const userData = {
      cpf: '12345678900',
      telefone: '11999999999',
      nome: 'Cliente'
    };

    // Chama a API usando caminho relativo (funciona em qualquer domínio)
    const response = await fetch('/api/hunterpay-pix', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(userData)
    });

    const data = await response.json();

    if (data.success) {
      // Atualizar o código PIX na interface
      const pixElement = document.querySelector('.bg-gray-50.p-2.rounded.border');
      if (pixElement) {
        pixElement.textContent = data.codigo_pix;

        // Adicionar funcionalidade ao botão de copiar
        const copyButton = document.getElementById('copy-pix-btn');

        if (copyButton) {
          copyButton.onclick = function() {
            navigator.clipboard.writeText(data.codigo_pix).then(() => {
              // Feedback visual de cópia
              const spanElement = copyButton.querySelector('span');
              const originalText = spanElement.textContent;
              spanElement.textContent = 'Copiado!';
              setTimeout(() => {
                spanElement.textContent = originalText;
              }, 2000);
            }).catch(err => {
              console.error('Erro ao copiar:', err);
              // Fallback para navegadores que não suportam clipboard API
              const textArea = document.createElement('textarea');
              textArea.value = data.codigo_pix;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand('copy');
              document.body.removeChild(textArea);

              const spanElement = copyButton.querySelector('span');
              const originalText = spanElement.textContent;
              spanElement.textContent = 'Copiado!';
              setTimeout(() => {
                spanElement.textContent = originalText;
              }, 2000);
            });
          };
        }
      }
    } else {
      console.error('Erro ao gerar PIX:', data.error);
      // Mostrar mensagem de erro
      const pixElement = document.querySelector('.bg-gray-50.p-2.rounded.border');
      if (pixElement) {
        pixElement.textContent = 'Erro ao gerar código PIX. Tente novamente.';
        pixElement.style.color = '#dc2626';
      }
    }
  } catch (error) {
    console.error('Erro na requisição:', error);
    const pixElement = document.querySelector('.bg-gray-50.p-2.rounded.border');
    if (pixElement) {
      pixElement.textContent = 'Erro de conexão. Tente novamente.';
      pixElement.style.color = '#dc2626';
    }
  }
}

1. Copie o código PIX clicando no botão "Copiar Código PIX"<br>
2. Abra o aplicativo do seu banco<br>
3. Acesse a área PIX e selecione "Pagar com PIX Copia e Cola"<br>
4. Cole o código copiado e confirme o pagamento<br>
<br>
Após a confirmação do pagamento, seu cadastro no Programa CNH do Brasil será ativado e você já poderá iniciar as aulas teóricas pelo aplicativo oficial.
<br<br>
Assim que realizar o pagamento das taxas no valor de R$ 64,73, clique no botão abaixo para ativar seu cadastro.`);

  const b=document.createElement('button');
  b.className='primary-btn';
  b.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check mr-2" style="display:inline-block;margin-right:8px;"><polyline points="20,6 9,17 4,12"></polyline></svg>Gerar Código PIX';
  b.onclick = async function() {
    try {
      // Mostrar loading
      b.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin" style="display:inline-block;margin-right:8px;"><circle cx="12" cy="12" r="10"/><path d="m4 12a8 8 0 0 1 8-8"/></svg>Gerando código PIX...';
      b.disabled = true;

      // Chama a API usando caminho relativo (funciona em qualquer domínio)
      const requestBody = {
        cpf: '12345678901', // Você pode obter isso do formulário anterior
        telefone: '11999999999', // Você pode obter isso do formulário anterior
        nome: 'Cliente'
      };

      const response = await fetch('/api/hunterpay-pix', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(requestBody)
      });

      const data = await response.json();

      if (data.success) {
        // Criar botão para copiar código PIX
        const copyButton = document.createElement('button');
        copyButton.className = 'primary-btn';
        copyButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;margin-right:8px;"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="m4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copiar Código PIX';
        copyButton.onclick = function() {
          navigator.clipboard.writeText(data.codigo_pix).then(function() {
            copyButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;margin-right:8px;"><polyline points="20,6 9,17 4,12"></polyline></svg>Código Copiado!';
            setTimeout(() => {
              copyButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;margin-right:8px;"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="m4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copiar Código PIX';
            }, 2000);
          });
        };

        // Mostrar código PIX em um campo de texto
        const pixCodeContainer = document.createElement('div');
        pixCodeContainer.style.cssText = 'background:#f8f9fa;border:1px solid #e9ecef;border-radius:8px;padding:12px;margin:10px 0;font-family:monospace;font-size:12px;word-break:break-all;';
        pixCodeContainer.innerHTML = `<strong>Código PIX:</strong><br>${data.codigo_pix}`;

        // Substituir botão original
        b.parentNode.replaceChild(pixCodeContainer, b);
        flow.appendChild(copyButton);

        // Mensagem de sucesso
        bot('✅ Código PIX gerado com sucesso! Clique no botão acima para copiar o código.');

      } else {
        // Erro na geração do PIX
        b.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check mr-2" style="display:inline-block;margin-right:8px;"><polyline points="20,6 9,17 4,12"></polyline></svg>Tentar Novamente';
        b.disabled = false;
        bot('❌ Erro ao gerar código PIX: ' + (data.error || 'Erro desconhecido'));
      }

    } catch (error) {
      console.error('Erro:', error);
      b.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check mr-2" style="display:inline-block;margin-right:8px;"><polyline points="20,6 9,17 4,12"></polyline></svg>Tentar Novamente';
      b.disabled = false;
      bot('❌ Erro de conexão. Verifique sua internet e tente novamente.');
    }

    scrollToBottom();
  };
  flow.appendChild(b);
  scrollToBottom();
}
